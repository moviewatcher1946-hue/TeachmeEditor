<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDIT HEIST</title><style>
:root{--r:#e60012;--k:#0a0a0a;--w:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--w);font-family:Impact,"Arial Black",sans-serif;font-style:italic;overflow-x:hidden;padding-bottom:130px;background-image:radial-gradient(rgba(230,0,18,.4) 2px,transparent 2.5px),repeating-linear-gradient(135deg,transparent 0 60px,rgba(230,0,18,.14) 60px 120px);background-size:14px 14px,auto}
body:before{content:"";position:fixed;left:-25%;top:15%;width:65%;height:150%;background:var(--r);opacity:.25;transform:skewX(-18deg);z-index:-1}
header{background:var(--r);padding:14px 18px 66px;clip-path:polygon(0 0,100% 0,100% 50%,74% 86%,60% 58%,42% 100%,0 66%);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{margin:0;font-size:clamp(34px,9vw,68px);transform:skew(-8deg) rotate(-2deg);animation:idle 3s ease-in-out infinite}
#rank{background:var(--k);padding:6px 14px;font-size:16px;transform:skew(-10deg);white-space:nowrap}
.rl{display:inline-block;padding:0 .1em;margin:.02em;box-shadow:.06em .06em 0 #000;line-height:1.05}
nav{position:relative;display:flex;gap:6px;padding:0 12px;margin-top:-30px;flex-wrap:wrap}
nav button{position:relative;z-index:1;flex:1;min-width:110px;font:inherit;font-size:20px;padding:10px 6px;background:var(--k);color:var(--w);border:3px solid var(--w);cursor:pointer;transform:skew(-10deg)}
nav button.on{background:transparent}
#sel{position:absolute;background:var(--r);transform:skew(-10deg);transition:.3s cubic-bezier(.7,0,.3,1);box-shadow:5px 5px 0 #fff}
.mk{width:20px;height:16px;fill:currentColor;vertical-align:-2px;margin-right:4px}.mk ellipse{fill:var(--k)}
main{max-width:860px;margin:0 auto;padding:18px 14px}
h2{font-size:clamp(30px,8vw,52px);margin:8px 0 14px}h3{color:var(--r);background:var(--w);display:inline-block;padding:2px 14px;transform:skew(-10deg);margin:18px 0 6px}
.tog{display:inline-flex;margin:0 8px 12px 0}.tog button,.btn{font:inherit;font-size:18px;background:var(--k);color:var(--w);border:3px solid var(--w);padding:8px 16px;cursor:pointer;transform:skew(-10deg);transition:.15s}
.tog button.on,.btn{background:var(--r)}.btn.g{background:var(--k)}.btn:hover,.tog button:hover{transform:skew(-10deg) scale(1.08);background:var(--w);color:var(--r)}
.big2{font-size:26px;margin-top:14px;box-shadow:6px 6px 0 var(--w)}
input[type=text],#q,#ki,select{font:inherit;font-size:20px;width:100%;padding:10px 14px;margin:0 0 12px;background:var(--w);color:var(--k);border:0;border-left:12px solid var(--r);transform:skew(-4deg)}
.lab{display:block;font-size:18px;margin-bottom:8px}
.bar{position:relative;height:30px;background:var(--k);border:3px solid var(--w);transform:skew(-14deg);margin:6px 0 14px}.bar div{height:100%;background:var(--r);transition:.5s}.bar span{position:absolute;inset:0;text-align:center;font-size:18px;line-height:24px}
.card{display:flex;align-items:center;gap:16px;width:100%;margin:12px 0;padding:16px 26px;font:inherit;color:var(--w);background:none;border:0;cursor:pointer;position:relative;isolation:isolate;text-align:left;transform:skew(-8deg) rotate(-1deg);animation:slide .4s backwards;transition:.15s}
.card:nth-child(even){transform:skew(-8deg) rotate(1deg)}
.card:before{content:"";position:absolute;inset:-5px;background:var(--w);clip-path:polygon(0 0,97% 9%,100% 100%,3% 91%);z-index:-2}
.card:after{content:"";position:absolute;inset:0;background:var(--k);clip-path:polygon(0 0,97% 9%,100% 100%,3% 91%);z-index:-1;transition:.15s}
.card:hover{transform:skew(-8deg) rotate(-2deg) scale(1.04) translateX(16px)}.card:hover:after{background:var(--r)}
.card i{font-size:40px;color:var(--r)}.card:hover i{color:var(--k)}.card b{flex:1;font-weight:400;font-size:26px;text-shadow:3px 3px 0 var(--r)}.card:hover b{text-shadow:3px 3px 0 #000}.card small{font-size:15px;opacity:.85}
.card.lock{opacity:.55}.card.done i:after{content:" ★"}
.box{position:relative;isolation:isolate;padding:34px 24px;margin:12px 0;color:var(--k);text-align:center;animation:pop .3s}
.box:before{content:"";position:absolute;inset:0;background:var(--w);clip-path:polygon(0 5%,100% 0,97% 100%,2% 95%);z-index:-1}
.box:after{content:"";position:absolute;inset:10px -10px -10px 10px;background:var(--r);clip-path:polygon(0 5%,100% 0,97% 100%,2% 95%);z-index:-2}
.big{margin:8px 0;font-size:clamp(22px,5vw,32px)}.goal{font-size:22px;color:var(--r);background:var(--w);display:inline-block;padding:2px 12px;transform:skew(-8deg)}
.tag{background:var(--k);color:var(--w);padding:3px 12px;font-size:16px;display:inline-block;box-shadow:4px 4px 0 var(--r)}
.ctl{display:flex;justify-content:space-between;margin:14px 0}
.tip{background:var(--w);color:var(--k);padding:12px 18px;margin:12px 0;border-left:14px solid var(--r);font-size:19px;transform:skew(-4deg)}.tip b{color:var(--r);margin-right:8px}.task{border-left-color:var(--k)}
.good{border-left-color:#1c9a3b}.bad{border-left-color:#666}
kbd{font:inherit;font-size:24px;background:var(--r);color:var(--w);padding:4px 14px;min-width:80px;text-align:center;box-shadow:4px 4px 0 var(--k);display:inline-block}
.row{display:flex;align-items:center;gap:14px;margin:8px 0;padding:8px 16px;background:var(--w);color:var(--k);transform:skew(-6deg);border-left:12px solid var(--r)}.row b{font-weight:400;font-size:20px}
.hud{display:flex;gap:10px;flex-wrap:wrap;font-size:18px}.hud span{background:var(--w);color:var(--k);padding:2px 12px;transform:skew(-10deg)}
.opt{display:block;width:100%;margin:10px 0;padding:12px 12px 12px 46px;font:inherit;font-size:22px;background:var(--k);color:var(--w);border:3px solid var(--w);text-align:left;cursor:pointer;position:relative;transform:skew(-6deg);animation:slide .35s backwards;transition:.15s}
.opt:before{content:"▶";position:absolute;left:16px;opacity:0}.opt:hover{background:var(--r);transform:skew(-6deg) translateX(12px)}.opt:hover:before{opacity:1}.opt.ok{background:var(--r)}
.clear{text-align:center;font-size:clamp(40px,12vw,90px);background:var(--r);padding:24px 8px;transform:rotate(-3deg) skew(-8deg);text-shadow:6px 6px 0 var(--k);animation:pop .4s}
details.card{display:block;cursor:default}details summary{cursor:pointer;font-size:24px}details ol{font-size:19px;font-style:normal;line-height:1.5}
#player{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--k);border-top:4px solid var(--r);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pp{font:inherit;font-size:20px;width:44px;height:38px;background:var(--r);color:var(--w);border:3px solid var(--w);cursor:pointer;transform:skew(-10deg)}
#np{flex:1;min-width:130px;font-size:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#vol{width:90px;accent-color:var(--r)}
#player .btn{font-size:14px;padding:5px 12px}#player small{width:100%;font-size:11px;opacity:.7}
#wipe{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden;visibility:hidden}#wipe.go{visibility:visible}
#wipe b{position:absolute;top:-10%;left:-170%;width:150%;height:120%;transform:skewX(-20deg);background:var(--r)}
#wipe.go b{animation:sweep .6s ease-in-out both}#wipe b:nth-child(2){background:var(--w);animation-delay:.06s!important}#wipe b:nth-child(3){background:var(--k);animation-delay:.12s!important}
@keyframes sweep{from{left:-170%}to{left:120%}}
@keyframes slide{from{opacity:0;translate:-90px 0}to{opacity:1;translate:0 0}}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg)}70%{transform:scale(1.06)}100%{transform:none}}
@keyframes idle{0%,100%{transform:skew(-8deg) rotate(-2deg)}50%{transform:skew(-8deg) rotate(-1deg) scale(1.03)}}
@media(max-width:560px){nav button{font-size:16px;min-width:80px}.card b{font-size:21px}}


/* ---- STAR PACK ---- */
:root{--cur:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E%3Cpath d='M3 2 3 22 8 17 12 27 16 25 12 16 19 16Z' transform='translate(3 3)' fill='%23e60012' stroke='%23e60012' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M3 2 3 22 8 17 12 27 16 25 12 16 19 16Z' fill='black' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E") 3 2,auto}
body,body *{cursor:var(--cur)!important}
#q,#ki,select{cursor:text!important}
.star{position:fixed;pointer-events:none;background:var(--r);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);z-index:-1}
#bgstar1{width:520px;height:520px;right:-150px;top:190px;opacity:.35;animation:spin 60s linear infinite}
#bgstar2{width:260px;height:260px;left:-60px;bottom:130px;background:#fff;opacity:.08;animation:spin 45s linear infinite reverse}
.pst{position:fixed;width:22px;height:22px;background:var(--w);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);pointer-events:none;z-index:8;animation:sfly .8s ease-out forwards}
.pst.r{background:var(--r)}
@keyframes sfly{to{transform:translate(var(--x),var(--y)) rotate(540deg) scale(.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
h1:before{content:"";display:inline-block;width:.8em;height:.8em;margin-right:.2em;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.05em;animation:spin 8s linear infinite}
h3:before{content:"★ "}
.card b:before{content:"★ ";color:var(--r)}.card:hover b:before{color:var(--k)}
.goal{background:#f4ead0;color:var(--r);border:3px solid var(--k);box-shadow:5px 5px 0 var(--r);padding:6px 20px 6px 46px;position:relative;transform:rotate(-2deg) skew(-4deg)}
.goal:before{content:"";position:absolute;left:10px;top:50%;margin-top:-13px;width:26px;height:26px;background:var(--r);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const S={sec:"modules",app:"pr",os:"win",learned:{},mod:null,step:0,q:"",fc:null,flip:false,T:null,scope:"all",mode:"normal",rank:"ROOKIE",iv:null};
const MODS=()=>({pr:PR_MODULES,ae:AE_MODULES,sd:SD_MODULES,gfx:GFX_MODULES})[S.app],ALLM=()=>[...PR_MODULES,...AE_MODULES,...SD_MODULES,...GFX_MODULES];
const ARC=["FOOL","MAGICIAN","PRIESTESS","EMPRESS","EMPEROR","HIEROPHANT","LOVERS","CHARIOT","JUSTICE","HERMIT"],ST={g:0,p:0,c:0};
const statHud=()=>`<div class="hud"><span>KNOWLEDGE ${Object.keys(S.learned).length}</span><span>GUTS ${ST.g}</span><span>PROFICIENCY ${ST.p}</span><span>CHARM ${ST.c}%</span></div>`;
const NAMES={pr:"PREMIERE",ae:"AFTER FX",sd:"SOUND",gfx:"GFX"},SECS=[["modules","MODULES"],["hotkeys","HOTKEYS"],["tests","TESTS"],["help","HELP"]];
const SHAKE=[{translate:"-10px 0"},{translate:"10px 0"},{translate:"0 0"}];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"").replace(/command/g,"cmd").replace(/control/g,"ctrl").replace(/delete/g,"del");

/* ---------- audio: sfx + music ---------- */
let ac,mg,armed=false,tm=null,st=0,au=null,synth=false,playing=false,trackName="";
addEventListener("pointerdown",()=>armed=true,{once:true});
function AC(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=+$("#vol").value;mg.connect(ac.destination)}if(ac.state!="running")ac.resume();return ac}
function tone(f,d,ty,v,t=AC().currentTime){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d)}
function nz(t,d,ty,fr,q,v){const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type=ty;f.frequency.value=fr;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t)}
function thump(t,f0,f1,d,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(!armed)return;const t=AC().currentTime;
if(k=="hover")nz(t,.03,"highpass",6000,.5,.05);
else if(k=="click"){nz(t,.05,"bandpass",3000,1.2,.4);thump(t,220,70,.1,.55)}
else if(k=="ok")[660,880,1320].forEach((n,i)=>tone(n,.2,"triangle",.14,t+i*.07));
else if(k=="no"){tone(160,.2,"sawtooth",.15);tone(110,.3,"sawtooth",.15,t+.12)}
else if(k=="clear")[523,659,784,1047].forEach((n,i)=>tone(n,.35,"square",.1,t+i*.1));
else if(k=="flash"){
const n=ac.sampleRate*.3|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),h=t+.26;s.buffer=b;f.type="bandpass";f.Q.value=2;
f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(9000,h);
g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.32,h-.01);g.gain.exponentialRampToValueAtTime(.001,h+.02);
s.connect(f);f.connect(g);g.connect(mg);s.start(t);
const o=ac.createOscillator(),lf=ac.createBiquadFilter(),og=ac.createGain();o.type="sawtooth";lf.type="lowpass";lf.frequency.value=2400;
o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1500,h);
og.gain.setValueAtTime(.001,t);og.gain.exponentialRampToValueAtTime(.07,h-.01);og.gain.exponentialRampToValueAtTime(.001,h+.02);
o.connect(lf);lf.connect(og);og.connect(mg);o.start(t);o.stop(h+.05);
thump(h,150,32,.6,.85);nz(h,.08,"highpass",5000,.6,.4);nz(h,.35,"highpass",8000,.5,.09);
[1568,2093,2637,3136,4186].forEach((fr,i)=>{tone(fr,.22,"triangle",.07,h+.03+i*.045);tone(fr*2,.12,"sine",.025,h+.03+i*.045)})}
else if(k=="trumpet"){[[392,0,.16],[523,.14,.16],[659,.28,.42]].forEach(([f,o,d])=>{const s=t+o;[0,6].forEach(dt=>{const os=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();os.type="sawtooth";os.frequency.value=f;os.detune.value=dt;fl.type="lowpass";fl.Q.value=4;fl.frequency.setValueAtTime(600,s);fl.frequency.exponentialRampToValueAtTime(3200,s+.06);fl.frequency.exponentialRampToValueAtTime(1800,s+d);g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.12,s+.03);g.gain.setValueAtTime(.12,s+d*.6);g.gain.exponentialRampToValueAtTime(.001,s+d);os.connect(fl);fl.connect(g);g.connect(mg);os.start(s);os.stop(s+d+.02)})})}
else if(k=="whoosh"){
const n=ac.sampleRate*.5|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type="bandpass";f.Q.value=1.2;
f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(5000,t+.26);f.frequency.exponentialRampToValueAtTime(700,t+.5);
g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.35,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.5);
s.connect(f);f.connect(g);g.connect(mg);s.start(t);
const o=ac.createOscillator(),og=ac.createGain();o.type="sine";o.frequency.setValueAtTime(140,t+.24);o.frequency.exponentialRampToValueAtTime(38,t+.5);
og.gain.setValueAtTime(.001,t);og.gain.setValueAtTime(.6,t+.24);og.gain.exponentialRampToValueAtTime(.001,t+.55);
o.connect(og);og.connect(mg);o.start(t);o.stop(t+.6);
tone(1760,.09,"square",.07,t+.24);tone(2349,.14,"square",.05,t+.27)}}
let lastHover=null;
document.addEventListener("pointerover",e=>{const b=e.target.closest("button,.card,summary");if(b&&b!==lastHover)sfx("hover");lastHover=b});
/* original built-in loop (no copyrighted music) */
const hz=n=>440*2**((n-69)/12),CH=[[62,65,69,72],[67,71,74,77],[60,64,67,71],[69,73,76,79]];
function tick(){const t=ac.currentTime+.05,i=st%16,c=CH[st>>4&3];
if([0,3,7,10,14].includes(i))tone(hz(c[0]-24),.22,"sawtooth",.12,t);
if(i%4==0)tone(70,.15,"sine",.4,t);
if([3,6,11,14].includes(i))c.forEach(n=>tone(hz(n),.18,"square",.03,t));
if(i%2==0)tone(9000,.03,"square",.02,t);st++}
function playerUI(){$("#pp").textContent=playing?"❚❚":"▶";$("#np").textContent=playing?"♪ "+(au?trackName:"Built-in original loop"):"Paused · press play or load your own song"}
$("#pp").onclick=()=>{AC();sfx("click");if(au){playing?au.pause():au.play();playing=!playing}else{synth=!synth;clearInterval(tm);if(synth)tm=setInterval(tick,130);playing=synth}playerUI()};
$("#vol").oninput=e=>{if(mg)mg.gain.value=+e.target.value;if(au)au.volume=+e.target.value};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;AC();clearInterval(tm);synth=false;if(au)au.pause();au=new Audio(URL.createObjectURL(f));au.loop=true;au.volume=+$("#vol").value;trackName=f.name.replace(/\.[^.]+$/,"");au.play().catch(()=>{});playing=true;playerUI()};

/* ---------- ui helpers ---------- */
const FF=['Impact','Georgia','"Courier New"','"Arial Black"','"Times New Roman"'],CO=[["#fff","#0a0a0a"],["#0a0a0a","#fff"],["#e60012","#fff"],["#fff","#e60012"]];

const tog=(id,opts,cur)=>`<div class="tog" id="${id}">${opts.map(([k,l])=>`<button data-v="${k}" class="${k==cur?"on":""}">${l}</button>`).join("")}</div>`;
const bindTog=(id,fn)=>$$("#"+id+" button").forEach(b=>b.onclick=()=>{sfx("click");fn(b.dataset.v)});
function upd(){$("#rank").textContent=`${"★".repeat(Math.round(Object.keys(S.learned).length/ALLM().length*5))}${"☆".repeat(5-Math.round(Object.keys(S.learned).length/ALLM().length*5))} ${Object.keys(S.learned).length}/${ALLM().length} · ${S.rank}`}
function sel(){const b=$("#nav .on"),s=$("#sel");if(b&&s){s.style.left=b.offsetLeft+"px";s.style.top=b.offsetTop+"px";s.style.width=b.offsetWidth+"px";s.style.height=b.offsetHeight+"px"}}

$$("button",n).forEach(b=>b.onclick=()=>{sfx("click");clearInterval(S.iv);S.sec=b.dataset.k;S.mod=null;S.fc=null;S.T=null;S.q="";go(view)});sel()}
function view(){nav();upd();({modules:vMods,hotkeys:vKeys,tests:vTests,help:vHelp})[S.sec]();$$("h2").forEach(e=>ransom(e,e.textContent))}
function search(fn){const i=$("#q");i.oninput=e=>{S.q=e.target.value;fn();const n=$("#q");n.focus();n.setSelectionRange(99,99)}}

/* ---------- modules ---------- */
function vMods(){if(S.mod)return vMod();const L=MODS(),done=L.filter(m=>S.learned[m.id]).length,q=S.q.toLowerCase();
$("#app").innerHTML=`<h2>MODULES</h2>${tog("tApp",[["pr","PREMIERE"],["ae","AFTER FX"],["sd","SOUND DESIGN"],["gfx","GFX"]],S.app)}<input id="q" placeholder="Search modules..." value="${esc(S.q)}">${statHud()}<div class="bar"><div style="width:${done/L.length*100}%"></div><span>${done}/${L.length} LEARNED</span></div>`+L.map((m,i)=>{

bindTog("tApp",v=>{S.app=v;S.q="";vMods()});search(vMods);
$$(".card").forEach(c=>c.onclick=(ev)=>{if(c.classList.contains("lock")){sfx("no");c.animate(SHAKE,{duration:250});return}sfx("click");S.mod=L[c.dataset.i];S.step=0;paperTear(ev,view)})}
function vMod(){const m=S.mod,n=m.steps.length,on=!!S.learned[m.id];
$("#app").innerHTML=`<button class="btn" id="back">◀ BACK</button><h2>${esc(m.title)}</h2><span class="goal">${esc(m.goal)}</span><div class="box"><span class="tag">STEP ${S.step+1}/${n}</span><p class="big">${esc(m.steps[S.step])}</p></div><div class="ctl"><button class="btn g" id="pv">◀</button><button class="btn" id="nx">▶</button></div><div class="tip"><b>PRO TIP</b>${esc(m.tip)}</div><div class="tip task"><b>PRACTICE</b>${esc(m.task)}</div><button class="btn big2${on?" g":""}" id="lrn">${on?"★ LEARNED":"MARK AS LEARNED"}</button>`;

function pool(scope){const g=HOTKEYS.map((h,i)=>({id:"k"+i,app:h[0],mod:null,type:"key",q:`${NAMES[h[0]]}: ${h[2]}?`,a:h[3],mac:h[4],exp:`${h[2]} = ${h[3]} (Win) / ${h[4]} (Mac)`}));

<script>
/* ==========================================================
   EDIT HEIST FX MODULE
   Extra sounds + visual effects layered on top of the app.
   Toggle with the FX button in the player bar.
   ========================================================== */
(function () {
  'use strict';

  const FX = {
    on: true,
    reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
    lastTrail: 0
  };

  /* ---------- styles ---------- */
  const css = `
  .btn{position:relative;overflow:hidden}
  .btn:after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);

  @keyframes shine{to{left:140%}}

  .ring{position:fixed;width:10px;height:10px;border:3px solid #fff;border-radius:50%;
    pointer-events:none;z-index:8;transform:translate(-50%,-50%);
    animation:ringOut .55s ease-out forwards}
  @keyframes ringOut{to{width:190px;height:190px;opacity:0;border-color:var(--r)}}

  .trail{position:fixed;width:9px;height:9px;background:var(--r);pointer-events:none;

  .confetti{position:fixed;top:-20px;width:10px;height:16px;pointer-events:none;z-index:8;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

  #flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;background:var(--r)}
  #flash.go{animation:flashA .35s ease-out}
  #flash.white{background:#fff}
  @keyframes flashA{0%{opacity:.55}100%{opacity:0}}

  #app.shake{animation:shakeA .4s}
  @keyframes shakeA{
    0%,100%{translate:0 0}
    15%{translate:-14px 4px}30%{translate:12px -5px}
    45%{translate:-9px 3px}60%{translate:7px -2px}80%{translate:-3px 1px}
  }

  #logo:hover,#logo.glitch{animation:glitchA .28s steps(2) infinite}
  @keyframes glitchA{
    0%{text-shadow:-4px 0 #0ff,4px 0 #f0f;translate:0 0}
    50%{text-shadow:4px 0 #0ff,-4px 0 #f0f;translate:3px -2px}
    100%{text-shadow:-2px 0 #0ff,2px 0 #f0f;translate:-3px 2px}
  }

  .callout{position:fixed;left:50%;top:36%;z-index:10;white-space:nowrap;pointer-events:none;
    font-size:clamp(44px,13vw,116px);color:#fff;text-shadow:6px 6px 0 var(--r);
    transform:translate(-50%,-50%) rotate(-6deg) skew(-8deg);animation:calloutA 1s forwards}
  @keyframes calloutA{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) skew(-8deg) scale(2.4)}
    18%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) skew(-8deg) scale(1)}
    80%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-56%) rotate(-6deg) skew(-8deg) scale(1.08)}
  }

  .slash{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden;
    background:rgba(0,0,0,.55);animation:slashBg 1.5s forwards}
  .slash i{position:absolute;left:-30%;width:160%;height:16vh;background:#fff;
    transform:skewY(-12deg) translateX(-120%);animation:slashBar .5s .05s cubic-bezier(.2,.9,.2,1) forwards}
  .slash i.a{top:22%}
  .slash i.b{top:52%;background:var(--r);animation-delay:.14s}
  .slash b{position:absolute;left:50%;top:44%;font-size:clamp(40px,12vw,110px);color:var(--k);

  @keyframes slashTxt{
    0%{opacity:0;scale:2.2}15%{opacity:1;scale:1}85%{opacity:1}100%{opacity:0}
  }
  @keyframes slashBg{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

  #grain{position:fixed;inset:-50%;z-index:6;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation:grainA .6s steps(4) infinite}
  @keyframes grainA{
    0%{transform:translate(0,0)}25%{transform:translate(-6%,4%)}
    50%{transform:translate(5%,-5%)}75%{transform:translate(-3%,6%)}100%{transform:translate(0,0)}

  body.nofx #grain,body.nofx .trail{display:none}
  `;
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);

  /* ---------- persistent layers ---------- */
  const grain = document.createElement('div');
  grain.id = 'grain';
  document.body.appendChild(grain);

  const flashEl = document.createElement('div');
  flashEl.id = 'flash';
  document.body.appendChild(flashEl);

  /* ---------- FX toggle button ---------- */
  const fxBtn = document.createElement('button');
  fxBtn.className = 'btn';
  fxBtn.id = 'fxb';
  fxBtn.textContent = 'FX: ON';
  fxBtn.onclick = function () {
    FX.on = !FX.on;
    fxBtn.textContent = FX.on ? 'FX: ON' : 'FX: OFF';
    document.body.classList.toggle('nofx', !FX.on);
    if (FX.on) sfx('click');
  };
  const player = document.getElementById('player');
  player.insertBefore(fxBtn, player.querySelector('small'));

  /* ---------- small DOM helpers ---------- */
  function spawn(cls, x, y, ttl) {
    const d = document.createElement('div');
    d.className = cls;
    if (x !== undefined) { d.style.left = x + 'px'; d.style.top = y + 'px'; }
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, ttl);
    return d;
  }

  function ring(x, y) {
    spawn('ring', x, y, 600);
  }

  function flash(white) {
    flashEl.className = white ? 'white' : '';
    void flashEl.offsetWidth;
    flashEl.className += ' go';
  }

  function shake() {
    const a = document.getElementById('app');
    a.classList.remove('shake');
    void a.offsetWidth;
    a.classList.add('shake');
  }

  function glitchLogo() {
    const l = document.getElementById('logo');
    l.classList.add('glitch');
    setTimeout(function () { l.classList.remove('glitch'); }, 450);
  }

  function callout(text) {
    const d = spawn('callout', undefined, undefined, 1050);
    d.textContent = text;
  }

  function slash(text) {
    const d = spawn('slash', undefined, undefined, 1550);
    d.innerHTML = '<i class="a"></i><i class="b"></i><b>' + text + '</b>';
  }

  function confetti(n) {
    const colours = ['#e60012', '#ffffff', '#f4ead0', '#0a0a0a'];
    for (let i = 0; i < n; i++) {
      const c = spawn('confetti', Math.random() * innerWidth, -20, 3200);

      c.style.setProperty('--dx', (Math.random() * 240 - 120) + 'px');
      c.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      if (i % 3 === 0) c.style.borderRadius = '50%';

  }

  /* ---------- extra sounds (all synthesized) ---------- */
  function glitchBurst(t) {
    for (let i = 0; i < 7; i++) {
      const f = 200 + Math.random() * 1800;
      tone(f, 0.035, 'square', 0.08, t + i * 0.035);
    }
    nz(t, 0.25, 'bandpass', 900, 3, 0.18);
  }

  function coinSparkle(t) {
    tone(1976, 0.09, 'square', 0.06, t);
    tone(2637, 0.28, 'square', 0.06, t + 0.07);
  }

  function crash(t) {
    nz(t, 0.9, 'highpass', 6500, 0.4, 0.22);
    nz(t, 0.5, 'highpass', 3000, 0.4, 0.1);
  }

  function arpeggio(t) {
    const notes = [523, 659, 784, 1047, 1319, 1568];
    notes.forEach(function (n, i) {
      tone(n, 0.3, 'triangle', 0.09, t + i * 0.06);
      tone(n, 0.3, 'triangle', 0.04, t + i * 0.06 + 0.14); /* echo */
    });
  }

  function slashSound(t) {
    thump(t, 900, 60, 0.35, 0.5);
    nz(t, 0.18, 'highpass', 4000, 0.8, 0.35);
    tone(2200, 0.08, 'sawtooth', 0.06, t + 0.02);
  }

  function stinger(t) {
    [392, 523, 659].forEach(function (n, i) {
      tone(n, 0.16, 'sawtooth', 0.05, t + i * 0.06);
    });
    thump(t, 130, 45, 0.25, 0.4);
  }

  function extraSound(k) {
    const t = AC().currentTime;
    if (k === 'no') glitchBurst(t);
    else if (k === 'ok') coinSparkle(t);
    else if (k === 'clear') { crash(t); arpeggio(t + 0.05); }
    else if (k === 'slash') slashSound(t);
    else if (k === 'stinger') stinger(t);
  }

  /* ---------- hook into the existing sfx() ---------- */
  const baseSfx = sfx;
  sfx = function (k) {
    baseSfx(k);
    if (!FX.on || !armed) return;
    extraSound(k);
    if (FX.reduced) return;

    if (k === 'click') ring(mx, my);
    else if (k === 'no') { shake(); flash(false); glitchLogo(); }
    else if (k === 'clear') {
      confetti(36);
      flash(true);
      const T = S.T;
      if (T && T.end && T.pct >= 90) { slash('ALL-OUT ATTACK'); extraSound('slash'); }
      else callout('CLEARED!');
    }
  };

  /* ---------- streak callouts (watch the answer feedback) ---------- */
  let lastFb = null;
  new MutationObserver(function () {
    if (!FX.on) return;
    const b = document.querySelector('#fb .tip b');
    if (!b || b === lastFb) return;
    lastFb = b;
    const txt = b.textContent.trim();
    if (txt === 'ONE MORE!' || txt === 'BATON PASS!') {
      if (armed) extraSound('stinger');
      if (!FX.reduced) { callout(txt); flash(true); }
    }
  }).observe(document.getElementById('app'), { childList: true, subtree: true });

  /* ---------- cursor trail ---------- */
  addEventListener('pointermove', function (e) {
    if (!FX.on || FX.reduced) return;
    const now = performance.now();
    if (now - FX.lastTrail < 45) return;
    FX.lastTrail = now;
    const d = spawn('trail' + (Math.random() < 0.4 ? ' w' : ''), e.clientX - 4, e.clientY - 4, 520);
  });

  /* ---------- typing ticks in the shortcut answer box ---------- */
  document.addEventListener('keydown', function (e) {
    if (!FX.on || !armed) return;
    if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') {

    }
  });
})();

<script>
/* ==========================================================
   EDIT HEIST FIRE + PAPER TEAR MODULE
   1) Cartoon fire trail: flat single-shade red flames
   2) Paper tear transition when opening a module
   ========================================================== */
(function () {
  'use strict';
  const RED = '#e60012';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fxOff = () => reduced || document.body.classList.contains('nofx');

  const css = `
  #fire{position:fixed;inset:0;z-index:9;pointer-events:none}
  .tear{position:fixed;inset:0;z-index:11}
  .tear .half{position:absolute;inset:0;filter:drop-shadow(0 8px 12px rgba(0,0,0,.65))}
  .tear .paper{position:absolute;inset:0;clip-path:var(--clip);
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 2px,transparent 2px 5px),#f4ead0;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .tear .paper b{font-weight:400;font-size:clamp(56px,16vw,150px);line-height:.95;color:var(--r);
    text-shadow:6px 6px 0 #0a0a0a;transform:rotate(-6deg) skew(-8deg)}
  .tear .l{transform-origin:0 100%}
  .tear .r{transform-origin:100% 0}
  .tear.go .l{animation:pullL .85s .04s cubic-bezier(.55,0,.85,.45) forwards}
  .tear.go .r{animation:pullR .85s .04s cubic-bezier(.55,0,.85,.45) forwards}
  @keyframes pullL{
    0%{transform:none}
    16%{transform:translateX(-1.2%) rotate(-1.2deg)}
    100%{transform:translateX(-78%) translateY(9%) rotate(-17deg)}
  }
  @keyframes pullR{
    0%{transform:none}
    16%{transform:translateX(1.2%) rotate(1deg)}
    100%{transform:translateX(78%) translateY(-7%) rotate(15deg)}
  }
  .scrap{position:absolute;width:14px;height:10px;background:#f4ead0;
    clip-path:polygon(0 20%,60% 0,100% 45%,70% 100%,10% 80%);animation:scrapA .8s ease-out forwards}
  @keyframes scrapA{to{transform:translate(var(--sx),var(--sy)) rotate(var(--sr));opacity:0}}
  .tog{flex-wrap:wrap}
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  /* ================= CUT-PAPER FLAME ================= */
  const cv = document.createElement('canvas');
  cv.id = 'fire';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, running = false;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  /* Cut-paper flame. Appears ONLY while the cursor is moving.
     About every 90ms a brand-new random polygon is cut: random number of
     tongues, random tongue heights, notch depths, width and length, all in
     pixels. Between cuts the shape is only rotated to follow the motion,
     never scaled, so every pose is genuinely different. Flat single red
     with a hard offset shadow, like paper on a table. */
  const F = { bx: 0, by: 0, vx: 0, vy: 0, ang: -Math.PI / 2, shape: null, nextCut: 0, lastMove: -1e9 };
  const SHOW_MS = 70;                                   /* grace between mouse events */
  const rnd = function (a, b) { return a + Math.random() * (b - a); };

  function cutShape(speed) {
    const len = (70 + Math.min(speed, 60) * 1.5) * rnd(0.8, 1.3);
    const bw = rnd(11, 22);

    function side() {
      const n = Math.floor(rnd(3, 7)), ts = [], v = [];
      for (let i = 0; i < n; i++) ts.push(rnd(0.08, 0.9));
      ts.sort(function (a, b) { return a - b; });
      ts.forEach(function (t) {
        const w = bw * Math.pow(1 - t, 0.8);
        v.push({ a: len * t, c: w * rnd(0.15, 0.6) });                        /* notch */
        v.push({ a: len * Math.min(0.97, t + rnd(0.05, 0.22)), c: w * rnd(0.8, 1.8) }); /* tongue tip */
      });
      return v;
    }
    return { len: len, bw: bw, L: side(), R: side(), tipC: rnd(-0.18, 0.18) * len };
  }

  function paperFlame() {
    const s = F.shape, ux = Math.cos(F.ang), uy = Math.sin(F.ang), nx = -uy, ny = ux;
    const P = function (a, c) { return { x: F.bx + ux * a + nx * c, y: F.by + uy * a + ny * c }; };

    const start = P(0, s.bw), end = P(0, -s.bw), tip = P(s.len, s.tipC);
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    s.L.forEach(function (v) { const p = P(v.a, v.c); ctx.lineTo(p.x, p.y); });
    ctx.lineTo(tip.x, tip.y);
    s.R.slice().reverse().forEach(function (v) { const p = P(v.a, -v.c); ctx.lineTo(p.x, p.y); });
    ctx.lineTo(end.x, end.y);
    const belly = P(-s.bw * 1.5, 0);
    ctx.quadraticCurveTo(belly.x, belly.y, start.x, start.y);                 /* rounded belly */
    ctx.closePath();
    ctx.fill();
  }

  function frame() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    if (now - F.lastMove < SHOW_MS) {
      if (!F.shape || now > F.nextCut) { F.shape = cutShape(Math.hypot(F.vx, F.vy)); F.nextCut = now + 90; }
      F.ang += (Math.atan2(-1, -F.vx * 0.08) - F.ang) * 0.3;                   /* lean away from motion */
      F.vx *= 0.85; F.vy *= 0.85;

      ctx.fillStyle = RED;
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 5;
      paperFlame();
      requestAnimationFrame(frame);
    } else {
      running = false;                                                        /* cursor stopped: flame is gone */
    }
  }

  addEventListener('pointermove', function (e) {
    if (fxOff()) return;
    const now = performance.now(), x = e.clientX, y = e.clientY;
    if (now - F.lastMove >= SHOW_MS) {                                        /* fresh appearance */
      F.vx = 0; F.vy = 0; F.ang = -Math.PI / 2; F.shape = null;
    } else {
      F.vx = F.vx * 0.5 + (x - F.bx) * 0.5;
      F.vy = F.vy * 0.5 + (y - F.by) * 0.5;
    }
    F.bx = x; F.by = y; F.lastMove = now;
    if (!running) { running = true; requestAnimationFrame(frame); }
  });

  /* ================= PAPER TEAR ================= */
  function ripSound() {
    if (typeof armed === 'undefined' || !armed) return;
    const t = AC().currentTime;
    for (let i = 0; i < 16; i++) {
      nz(t + 0.06 + i * 0.028, 0.035, 'bandpass', 1800 + Math.random() * 3500, 1.5, 0.16 + Math.random() * 0.1);
    }
    nz(t, 0.5, 'highpass', 2500, 0.4, 0.06);
    thump(t + 0.05, 180, 60, 0.15, 0.25);
  }

  window.paperTear = function (ev, fn) {
    if (fxOff() || busy) { go(fn); return; }
    busy = true;
    const x = ev && ev.clientX != null ? ev.clientX / innerWidth * 100 : 50;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const jx = x + (Math.random() - 0.5) * 8 * (i % 2 ? 1 : 0.5);
      pts.push(jx.toFixed(1) + '% ' + (i * 100 / 12).toFixed(1) + '%');
    }
    const left = 'polygon(0 0,' + pts.join(',') + ',0 100%)';
    const right = 'polygon(' + pts.join(',') + ',100% 100%,100% 0)';
    const label = '<b>EDIT<br>HEIST</b>';

    const o = document.createElement('div');
    o.className = 'tear';
    o.innerHTML =
      '<div class="half l"><div class="paper" style="--clip:' + left + '">' + label + '</div></div>' +
      '<div class="half r"><div class="paper" style="--clip:' + right + '">' + label + '</div></div>';
    document.body.appendChild(o);

    fn();
    window.scrollTo(0, 0);

    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'scrap';
      s.style.left = (x + (Math.random() - 0.5) * 6) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.setProperty('--sx', (Math.random() * 360 - 180) + 'px');
      s.style.setProperty('--sy', (Math.random() * 240 - 60) + 'px');
      s.style.setProperty('--sr', (Math.random() * 720 - 360) + 'deg');
      s.style.animationDelay = (0.1 + Math.random() * 0.25) + 's';
      o.appendChild(s);
    }

    requestAnimationFrame(function () {
      void o.offsetWidth;
      o.classList.add('go');
      ripSound();
    });
    setTimeout(function () { o.remove(); busy = false; }, 1000);
  };
})();
</script>
</body></html>
