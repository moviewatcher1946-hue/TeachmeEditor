<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={sec:"modules",app:"pr",os:"win",learned:{},mod:null,step:0,q:"",fc:null,flip:false,T:null,scope:"all",mode:"normal",rank:"ROOKIE",iv:null};
const MODS=()=>S.app=="pr"?PR_MODULES:AE_MODULES,ALLM=()=>[...PR_MODULES,...AE_MODULES];
const NAMES={pr:"PREMIERE",ae:"AFTER FX"},SECS=[["modules","MODULES"],["hotkeys","HOTKEYS"],["tests","TESTS"],["help","HELP"]];
const SHAKE=[{translate:"-10px 0"},{translate:"10px 0"},{translate:"0 0"}];

const norm=s=>String(s).toLowerCase().replace(/\s+/g,"").replace(/command/g,"cmd").replace(/control/g,"ctrl").replace(/delete/g,"del");

/* ---------- audio: sfx + music ---------- */
let ac,mg,armed=false,tm=null,st=0,au=null,synth=false,playing=false,trackName="";
addEventListener("pointerdown",()=>armed=true,{once:true});
function AC(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=+$("#vol").value;mg.connect(ac.destination)}if(ac.state!="running")ac.resume();return ac}
function tone(f,d,ty,v,t=AC().currentTime){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d)}
function nz(t,d,ty,fr,q,v){const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type=ty;f.frequency.value=fr;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t)}
function thump(t,f0,f1,d,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(!armed)return;const t=AC().currentTime;
if(k=="hover")nz(t,.03,"highpass",6000,.5,.05);
else if(k=="click"){nz(t,.05,"bandpass",3000,1.2,.4);thump(t,220,70,.1,.55)}
else if(k=="ok")[660,880,1320].forEach((n,i)=>tone(n,.2,"triangle",.14,t+i*.07));
else if(k=="no"){tone(160,.2,"sawtooth",.15);tone(110,.3,"sawtooth",.15,t+.12)}
else if(k=="clear")[523,659,784,1047].forEach((n,i)=>tone(n,.35,"square",.1,t+i*.1));
else if(k=="whoosh"){
const n=ac.sampleRate*.5|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type="bandpass";f.Q.value=1.2;
f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(5000,t+.26);f.frequency.exponentialRampToValueAtTime(700,t+.5);
g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.35,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+.5);
s.connect(f);f.connect(g);g.connect(mg);s.start(t);
const o=ac.createOscillator(),og=ac.createGain();o.type="sine";o.frequency.setValueAtTime(140,t+.24);o.frequency.exponentialRampToValueAtTime(38,t+.5);
og.gain.setValueAtTime(.001,t);og.gain.setValueAtTime(.6,t+.24);og.gain.exponentialRampToValueAtTime(.001,t+.55);
o.connect(og);og.connect(mg);o.start(t);o.stop(t+.6);
tone(1760,.09,"square",.07,t+.24);tone(2349,.14,"square",.05,t+.27)}}
let lastHover=null;
document.addEventListener("pointerover",e=>{const b=e.target.closest("button,.card,summary");if(b&&b!==lastHover)sfx("hover");lastHover=b});
/* original built-in loop (no copyrighted music) */
const hz=n=>440*2**((n-69)/12),CH=[[62,65,69,72],[67,71,74,77],[60,64,67,71],[69,73,76,79]];
function tick(){const t=ac.currentTime+.05,i=st%16,c=CH[st>>4&3];
if([0,3,7,10,14].includes(i))tone(hz(c[0]-24),.22,"sawtooth",.12,t);
if(i%4==0)tone(70,.15,"sine",.4,t);
if([3,6,11,14].includes(i))c.forEach(n=>tone(hz(n),.18,"square",.03,t));
if(i%2==0)tone(9000,.03,"square",.02,t);st++}

$("#pp").onclick=()=>{AC();sfx("click");if(au){playing?au.pause():au.play();playing=!playing}else{synth=!synth;clearInterval(tm);if(synth)tm=setInterval(tick,130);playing=synth}playerUI()};
$("#vol").oninput=e=>{if(mg)mg.gain.value=+e.target.value;if(au)au.volume=+e.target.value};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;AC();clearInterval(tm);synth=false;if(au)au.pause();au=new Audio(URL.createObjectURL(f));au.loop=true;au.volume=+$("#vol").value;trackName=f.name.replace(/\.[^.]+$/,"");au.play().catch(()=>{});playing=true;playerUI()};

/* ---------- ui helpers ---------- */
const FF=['Impact','Georgia','"Courier New"','"Arial Black"','"Times New Roman"'],CO=[["#fff","#0a0a0a"],["#0a0a0a","#fff"],["#e60012","#fff"],["#fff","#e60012"]];
function ransom(el,txt){if(txt.length>26)return;el.innerHTML=[...txt].map(ch=>{if(ch==" ")return"<i style='display:inline-block;width:.35em'></i>";const c=CO[Math.random()*4|0];return `<span class="rl" style="font-family:${FF[Math.random()*5|0]};background:${c[1]};color:${c[0]};transform:rotate(${Math.random()*14-7|0}deg) translateY(${Math.random()*8-4|0}px);font-size:${(.85+Math.random()*.4).toFixed(2)}em">${esc(ch)}</span>`}).join("")}
let busy=false;
function go(fn){if(busy)return fn();busy=true;const w=$("#wipe");w.className="";void w.offsetWidth;w.className="go";sfx("whoosh");setTimeout(()=>{fn();window.scrollTo(0,0);busy=false},260);setTimeout(()=>w.className="",750)}
const tog=(id,opts,cur)=>`<div class="tog" id="${id}">${opts.map(([k,l])=>`<button data-v="${k}" class="${k==cur?"on":""}">${l}</button>`).join("")}</div>`;
const bindTog=(id,fn)=>$$("#"+id+" button").forEach(b=>b.onclick=()=>{sfx("click");fn(b.dataset.v)});
function upd(){$("#rank").textContent=`${"★".repeat(Math.round(Object.keys(S.learned).length/ALLM().length*5))}${"☆".repeat(5-Math.round(Object.keys(S.learned).length/ALLM().length*5))} ${Object.keys(S.learned).length}/${ALLM().length} · ${S.rank}`}
function sel(){const b=$("#nav .on"),s=$("#sel");if(b&&s){s.style.left=b.offsetLeft+"px";s.style.top=b.offsetTop+"px";s.style.width=b.offsetWidth+"px";s.style.height=b.offsetHeight+"px"}}
function nav(){const n=$("#nav");n.innerHTML='<i id="sel"></i>'+SECS.map(([k,l],i)=>`<button data-k="${k}" class="${S.sec==k?"on":""}"><svg class="mk" viewBox="0 0 24 20"><path d="M2 6c6-4 14-4 20 0-1 8-6 12-10 12S3 14 2 6z"/><ellipse cx="8" cy="9" rx="2.6" ry="1.6"/><ellipse cx="16" cy="9" rx="2.6" ry="1.6"/></svg>${i+1} ${l}</button>`).join("");
$$("button",n).forEach(b=>b.onclick=()=>{sfx("click");clearInterval(S.iv);S.sec=b.dataset.k;S.mod=null;S.fc=null;S.T=null;S.q="";go(view)});sel()}
function view(){nav();upd();({modules:vMods,hotkeys:vKeys,tests:vTests,help:vHelp})[S.sec]();$$("h2").forEach(e=>ransom(e,e.textContent))}
function search(fn){const i=$("#q");i.oninput=e=>{S.q=e.target.value;fn();const n=$("#q");n.focus();n.setSelectionRange(99,99)}}

/* ---------- modules ---------- */
function vMods(){if(S.mod)return vMod();const L=MODS(),done=L.filter(m=>S.learned[m.id]).length,q=S.q.toLowerCase();
$("#app").innerHTML=`<h2>MODULES</h2>${tog("tApp",[["pr","PREMIERE"],["ae","AFTER FX"]],S.app)}<input id="q" placeholder="Search modules..." value="${esc(S.q)}"><div class="bar"><div style="width:${done/L.length*100}%"></div><span>${done}/${L.length} LEARNED</span></div>`+L.map((m,i)=>{
const lock=m.boss&&!L.slice(0,i).filter(x=>!x.boss).every(x=>S.learned[x.id]);
if(q&&!(m.title+" "+m.goal).toLowerCase().includes(q))return"";
return `<button class="card${lock?" lock":""}${S.learned[m.id]?" done":""}" data-i="${i}"><i>${String(i+1).padStart(2,"0")}</i><b>${esc(m.title)}</b><small>${lock?"🔒 LOCKED":m.boss?"BOSS":m.steps.length+" STEPS"}</small></button>`}).join("");
bindTog("tApp",v=>{S.app=v;S.q="";vMods()});search(vMods);
$$(".card").forEach(c=>c.onclick=()=>{if(c.classList.contains("lock")){sfx("no");c.animate(SHAKE,{duration:250});return}sfx("click");S.mod=L[c.dataset.i];S.step=0;go(view)})}
function vMod(){const m=S.mod,n=m.steps.length,on=!!S.learned[m.id];
$("#app").innerHTML=`<button class="btn" id="back">◀ BACK</button><h2>${esc(m.title)}</h2><span class="goal">${esc(m.goal)}</span><div class="box"><span class="tag">STEP ${S.step+1}/${n}</span><p class="big">${esc(m.steps[S.step])}</p></div><div class="ctl"><button class="btn g" id="pv">◀</button><button class="btn" id="nx">▶</button></div><div class="tip"><b>PRO TIP</b>${esc(m.tip)}</div><div class="tip task"><b>PRACTICE</b>${esc(m.task)}</div><button class="btn big2${on?" g":""}" id="lrn">${on?"★ LEARNED":"MARK AS LEARNED"}</button>`;
ransom($("h2"),m.title);
$("#back").onclick=()=>{sfx("click");S.mod=null;go(view)};
$("#pv").onclick=()=>{if(S.step>0){S.step--;sfx("click");vMod()}};
$("#nx").onclick=()=>{if(S.step<n-1){S.step++;sfx("click");vMod()}};
$("#lrn").onclick=()=>{if(S.learned[m.id])delete S.learned[m.id];else{S.learned[m.id]=1;sfx("clear")}upd();vMod()}}

/* ---------- hotkeys ---------- */
function vKeys(){if(S.fc)return vFlash();const q=S.q.toLowerCase(),H=HOTKEYS.filter(h=>h[0]==S.app&&(h[2]+" "+h[1]).toLowerCase().includes(q)),cats=[...new Set(H.map(h=>h[1]))];
$("#app").innerHTML=`<h2>HOTKEYS</h2>${tog("tApp",[["pr","PREMIERE"],["ae","AFTER FX"]],S.app)}${tog("tOs",[["win","WINDOWS"],["mac","MAC"]],S.os)}<input id="q" placeholder="Search hotkeys..." value="${esc(S.q)}"><button class="btn" id="fc">FLASHCARDS</button>`+cats.map(c=>`<h3>${esc(c)}</h3>`+H.filter(h=>h[1]==c).map(h=>`<div class="row"><kbd>${esc(S.os=="win"?h[3]:h[4])}</kbd><b>${esc(h[2])}</b></div>`).join("")).join("");
bindTog("tApp",v=>{S.app=v;vKeys()});bindTog("tOs",v=>{S.os=v;vKeys()});search(vKeys);
$("#fc").onclick=()=>{sfx("click");S.fc={i:0};S.flip=false;go(view)}}
function vFlash(){const P=HOTKEYS.filter(h=>h[0]==S.app),h=P[S.fc.i%P.length];
$("#app").innerHTML=`<button class="btn" id="back">◀ BACK</button><div class="box" id="card"><span class="tag">${esc(h[1])}</span><p class="big">${S.flip?`<kbd>${esc(S.os=="win"?h[3]:h[4])}</kbd>`:esc(h[2])}</p><small>TAP CARD TO FLIP</small></div><button class="btn" id="nx">NEXT ▶</button>`;
$("#back").onclick=()=>{S.fc=null;go(view)};
$("#card").onclick=()=>{sfx("click");S.flip=!S.flip;vFlash()};
$("#nx").onclick=()=>{sfx("click");S.fc.i=Math.random()*P.length|0;S.flip=false;vFlash()}}

/* ---------- tests ---------- */
function pool(scope){const g=HOTKEYS.map((h,i)=>({id:"k"+i,app:h[0],mod:null,type:"key",q:`${NAMES[h[0]]}: ${h[2]}?`,a:h[3],mac:h[4],exp:`${h[2]} = ${h[3]} (Win) / ${h[4]} (Mac)`}));
return [...QUIZZES,...g].filter(q=>scope=="all"||q.app==scope||q.mod==scope)}
function vTests(){if(S.T)return vQ();
$("#app").innerHTML=`<h2>TESTS</h2><label class="lab">SCOPE<select id="sc"><option value="all">ALL</option><option value="pr">PREMIERE</option><option value="ae">AFTER FX</option>${ALLM().map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("")}</select></label>${tog("tMode",[["normal","NORMAL"],["timed","TIMED 60s"]],S.mode)}${tog("tOs",[["win","WINDOWS"],["mac","MAC"]],S.os)}<br><button class="btn big2" id="go">START</button>`;
$("#sc").value=S.scope;$("#sc").onchange=e=>S.scope=e.target.value;
bindTog("tMode",v=>{S.mode=v;vTests()});bindTog("tOs",v=>{S.os=v;vTests()});
$("#go").onclick=()=>{const qs=shuffle(pool(S.scope));if(!qs.length){sfx("no");return}sfx("click");startT(qs,S.mode=="timed")}}
function startT(qs,timed){clearInterval(S.iv);S.T={qs,i:0,att:0,score:0,right:0,streak:0,best:0,wrong:[],end:false,timed,left:60,done:false};
if(timed)S.iv=setInterval(()=>{const T=S.T;if(!T||T.end)return clearInterval(S.iv);T.left--;const e=$("#tm");if(e)e.textContent=T.left+"s";if(T.left<=0)finish()},1000);go(view)}
function vQ(){const T=S.T;if(T.end)return vEnd();const q=T.qs[T.i];if(!q)return finish();
const body=q.type=="mc"?q.opts.map((o,i)=>`<button class="opt" data-c="${i==q.a?1:0}">${esc(o)}</button>`).join(""):q.type=="tf"?[["true","TRUE"],["false","FALSE"]].map(([v,l])=>`<button class="opt" data-c="${String(q.a)==v?1:0}">${l}</button>`).join(""):`<input id="ki" placeholder="Type it, e.g. Ctrl+K" autocomplete="off"><button class="btn" id="ks">SUBMIT</button>`;
$("#app").innerHTML=`<div class="hud"><span>Q ${T.i+1}/${T.qs.length}</span><span>SCORE ${T.score}</span><span>STREAK ${T.streak}</span>${T.timed?`<span id="tm">${T.left}s</span>`:""}</div><div class="box"><p class="big">${esc(q.q)}</p></div><div id="ans">${body}</div><div id="fb"></div>`;
$$("#ans .opt").forEach(b=>b.onclick=()=>ans(b.dataset.c=="1",q));
if(q.type=="key"){const sub=()=>ans(norm($("#ki").value)==norm(S.os=="win"?q.a:(q.mac||q.a)),q);$("#ks").onclick=sub;$("#ki").onkeydown=e=>{if(e.key=="Enter")sub()};$("#ki").focus()}}
function ans(ok,q){const T=S.T;if(T.done)return;T.done=true;T.att++;
if(ok){T.right++;T.streak++;T.best=Math.max(T.best,T.streak);T.score+=10+Math.min(T.streak,5)*2;sfx("ok")}else{T.streak=0;T.wrong.push(q);sfx("no")}
$$("#ans .opt").forEach(b=>{if(b.dataset.c=="1")b.classList.add("ok")});
$("#fb").innerHTML=`<div class="tip ${ok?"good":"bad"}"><b>${ok?"NICE!":"NOPE"}</b>${esc(q.exp||"")}</div><button class="btn" id="nq">NEXT ▶</button>`;
$("#nq").onclick=nq;if(T.timed)setTimeout(nq,700)}
function nq(){const T=S.T;if(!T||T.end||!T.done)return;T.i++;T.done=false;go(view)}
function finish(){clearInterval(S.iv);const T=S.T;if(!T||T.end)return;T.end=true;const p=T.att?T.right/T.att:0;
S.rank=p>=.9?"PHANTOM LEGEND":p>=.7?"ACE THIEF":p>=.5?"SHARP THIEF":"ROOKIE";T.pct=Math.round(p*100);sfx("clear");upd();if(S.sec=="tests")vEnd()}
function vEnd(){const T=S.T;
$("#app").innerHTML=`<div class="clear">${esc(S.rank)}</div><div class="hud"><span>SCORE ${T.score}</span><span>${T.right}/${T.att} RIGHT (${T.pct}%)</span><span>BEST STREAK ${T.best}</span></div><br>${T.wrong.length?`<button class="btn" id="rt">RETRY WRONG (${T.wrong.length})</button> `:""}<button class="btn g" id="nw">NEW TEST</button>`;
if(T.wrong.length)$("#rt").onclick=()=>{sfx("click");startT(shuffle(T.wrong),false)};
$("#nw").onclick=()=>{sfx("click");S.T=null;go(view)}}

/* ---------- help ---------- */
function vHelp(){$("#app").innerHTML=`<h2>HELP</h2>`+HELP.map(h=>`<details class="card"><summary>${esc(h.t)}</summary><ol>${h.fix.map(f=>`<li>${esc(f)}</li>`).join("")}</ol></details>`).join("")}

/* ---------- keyboard + boot ---------- */
document.addEventListener("keydown",e=>{const inp=/INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
if(e.key=="Escape"){S.mod=null;S.fc=null;go(view);return}
if(inp)return;
if(e.key=="Enter"&&$("#nq")){nq();return}
const i="1234".indexOf(e.key);if(i>-1){sfx("click");clearInterval(S.iv);S.sec=SECS[i][0];S.mod=null;S.fc=null;S.T=null;S.q="";go(view)}
if(S.mod&&e.key=="ArrowRight")$("#nx").click();if(S.mod&&e.key=="ArrowLeft")$("#pv").click()});
addEventListener("resize",sel);
ransom($("#logo"),"EDIT HEIST");view();


/* ---- STAR PACK ---- */
["bgstar1","bgstar2"].forEach(id=>{const d=document.createElement("div");d.id=id;d.className="star";document.body.appendChild(d)});
function starBurst(x,y,n){for(let i=0;i<n;i++){const d=document.createElement("div");d.className="pst"+(i%2?" r":"");d.style.left=x-11+"px";d.style.top=y-11+"px";const a=Math.random()*6.28,r=60+Math.random()*160;d.style.setProperty("--x",Math.cos(a)*r+"px");d.style.setProperty("--y",Math.sin(a)*r+"px");document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}
let mx=innerWidth/2,my=innerHeight/2;
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
document.addEventListener("pointerdown",e=>starBurst(e.clientX,e.clientY,6));
const _sfx=sfx;sfx=function(k){_sfx(k);if(k=="ok")starBurst(mx,my,14);if(k=="clear")starBurst(innerWidth/2,innerHeight/3,30)};
</script>
</body></html>
