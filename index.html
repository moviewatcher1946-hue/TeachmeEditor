<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TVBROAD // Tutorial System</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blk:#0a0a0a;--wht:#fff;--red:#E8001C;--cream:#F5F0E8;--yel:#FFD700;--pnl:#151515;
--disp:'Bebas Neue',sans-serif;--mono:'Share Tech Mono',monospace;--body:'Rajdhani',sans-serif}
body{background:var(--blk);color:var(--wht);font-family:var(--body);overflow-x:hidden}
.hide{display:none!important}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--red)}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:200;background:var(--blk);border-bottom:3px solid var(--red);display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.3rem;gap:1rem;flex-wrap:wrap}
.logo{font-family:var(--disp);font-size:1.2rem;letter-spacing:.1em;cursor:pointer}
.logo b{color:var(--red)}
#searchbox{background:var(--pnl);border:1px solid rgba(255,255,255,.2);color:var(--wht);font-family:var(--mono);font-size:.8rem;padding:.5rem .8rem;width:220px}
#searchresults{position:absolute;top:100%;left:0;right:0;background:var(--pnl);border:1px solid var(--red);max-height:260px;overflow-y:auto;z-index:300}
.sr-item{padding:.6rem .9rem;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.sr-item:hover{background:rgba(232,0,28,.15)}
.sr-wrap{position:relative}
#topProgress{font-family:var(--mono);font-size:.75rem;color:rgba(255,255,255,.5)}
#resetBtn{font-family:var(--body);font-weight:700;font-size:.68rem;letter-spacing:.1em;background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.5);padding:.4rem .8rem;cursor:pointer}
#resetBtn:hover{border-color:var(--red);color:var(--wht)}

/* LAYOUT */
#app{display:flex}
#sidebar{width:260px;flex:none;background:var(--pnl);border-right:2px solid rgba(255,255,255,.08);min-height:calc(100vh - 60px);padding:1rem 0;position:sticky;top:57px;align-self:flex-start;max-height:calc(100vh - 57px);overflow-y:auto}
.sb-item{padding:.8rem 1.2rem;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.sb-item:hover{background:rgba(255,255,255,.04)}
.sb-item.active{background:rgba(232,0,28,.1);border-left-color:var(--red)}
.sb-num{font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.35)}
.sb-name{font-family:var(--disp);font-size:1rem;letter-spacing:.03em;margin:.15rem 0 .4rem}
.sb-bar{height:4px;background:rgba(255,255,255,.1)}
.sb-fill{height:100%;background:var(--red)}
.sb-pct{font-family:var(--mono);font-size:.6rem;color:rgba(255,255,255,.35);margin-top:.2rem}
#sbToggle{display:none}

#main{flex:1;min-width:0;padding:2.5rem 3rem 6rem;max-width:900px}

/* HOME */
#home{padding:5rem 2rem;text-align:left;max-width:800px;margin:0 auto}
.home-eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.25em;color:var(--red);margin-bottom:1rem}
.home-title{font-family:var(--disp);font-size:clamp(3.5rem,10vw,7rem);line-height:.9;letter-spacing:.02em;margin-bottom:1rem}
.home-title em{color:var(--red);font-style:normal;-webkit-text-stroke:1px var(--wht);color:transparent}
.home-sub{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:2rem;letter-spacing:.03em}
.stack-badge{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--disp);font-size:1.3rem;letter-spacing:.1em;background:var(--pnl);border:2px solid var(--wht);padding:1rem 2rem;margin-bottom:2rem}
.stack-plus{color:var(--red);font-size:1rem;margin:.3rem 0}
.home-btn{display:block;width:fit-content;background:var(--red);color:var(--wht);font-family:var(--disp);font-size:1.3rem;letter-spacing:.08em;padding:1rem 2.4rem;border:none;cursor:pointer;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 100%,16px 100%);margin-bottom:1rem;transition:background .15s}
.home-btn:hover{background:#ff0020}
.home-progress-wrap{max-width:340px;margin-top:1.5rem}
.home-bar{height:12px;background:rgba(255,255,255,.1);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%)}
.home-bar-fill{height:100%;background:var(--red);width:0%;transition:width .4s}
.home-pct{font-family:var(--mono);font-size:.8rem;margin-top:.4rem;color:rgba(255,255,255,.5)}

/* SECTION HEADER */
.sec-eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--red);text-transform:uppercase;margin-bottom:.5rem}
.step-counter{font-family:var(--mono);font-size:.75rem;color:rgba(255,255,255,.4);margin-bottom:1rem}
.big-num{font-family:var(--disp);font-size:4rem;color:rgba(255,255,255,.08);line-height:.8;position:absolute;top:0;right:0}
.sec-head{position:relative;padding-bottom:1.5rem;border-bottom:3px solid var(--red);margin-bottom:2rem}
.sec-title{font-family:var(--disp);font-size:clamp(2rem,5vw,3.2rem);line-height:.95;letter-spacing:.02em}

/* STEP BLOCKS */
.block{margin-bottom:1.8rem}
.block h3{font-family:var(--disp);font-size:1.15rem;letter-spacing:.08em;color:var(--red);margin-bottom:.6rem}
.block p, .block li{font-size:1rem;line-height:1.65;color:rgba(255,255,255,.8)}
.block ul, .block ol{padding-left:1.3rem}
.block li{margin-bottom:.35rem}
.visual-box{background:var(--pnl);border:1px solid rgba(255,255,255,.12);padding:1.3rem 1.5rem;margin:1rem 0;font-family:var(--mono);font-size:.82rem;line-height:1.9;white-space:pre;overflow-x:auto}
.timing-row{display:flex;gap:1rem;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:.78rem}
.timing-t{width:70px;flex:none;color:var(--red)}
.track-diagram{margin:1rem 0}
.track-line{display:flex;align-items:center;gap:.8rem;padding:.35rem 0}
.track-lbl{font-family:var(--mono);font-size:.7rem;width:90px;flex:none;color:rgba(255,255,255,.55)}
.track-fill{height:16px;background:rgba(232,0,28,.5);flex:1}

/* CHECKPOINT */
.checkpoint{margin-top:2rem;padding:1.2rem 1.4rem;background:rgba(232,0,28,.06);border:2px solid var(--red)}
.cp-row{display:flex;align-items:center;gap:1rem;cursor:pointer;user-select:none}
.cp-box{width:26px;height:26px;border:2px solid var(--wht);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);transition:background .1s}
.cp-row.done .cp-box{background:var(--red);border-color:var(--red)}
.cp-label{font-family:var(--disp);font-size:1.1rem;letter-spacing:.05em}
.cp-row.done .cp-label{color:var(--red)}

/* NAV BUTTONS */
.step-nav{display:flex;justify-content:space-between;margin-top:2.5rem;gap:1rem}
.nav-arrow{font-family:var(--disp);font-size:1rem;letter-spacing:.08em;background:var(--pnl);border:2px solid rgba(255,255,255,.2);color:var(--wht);padding:.8rem 1.6rem;cursor:pointer;transition:border-color .15s}
.nav-arrow:hover:not(:disabled){border-color:var(--red)}
.nav-arrow:disabled{opacity:.25;cursor:default}

/* MULTI CHECKLIST (final check) */
.mc-group{margin-bottom:1.5rem}
.mc-group h4{font-family:var(--disp);letter-spacing:.08em;color:var(--red);margin-bottom:.6rem;font-size:1rem}
.mc-item{display:flex;align-items:center;gap:.8rem;padding:.4rem 0;cursor:pointer}
.mc-box{width:20px;height:20px;border:2px solid var(--wht);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:.85rem}
.mc-item.done .mc-box{background:var(--red);border-color:var(--red)}
.mc-item.done span{color:rgba(255,255,255,.4);text-decoration:line-through}
#masterComplete{display:none;margin-top:2rem;background:var(--red);color:var(--wht);text-align:center;padding:2rem;font-family:var(--disp);font-size:1.8rem;letter-spacing:.08em;clip-path:polygon(0 6%,100% 0,100% 94%,0 100%)}

/* PRESET */
.preset-row{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
.preset-btn{font-family:var(--disp);font-size:.95rem;letter-spacing:.04em;background:var(--pnl);border:2px solid rgba(255,255,255,.15);color:var(--wht);padding:.6rem 1.2rem;cursor:pointer}
.preset-btn.active,.preset-btn:hover{border-color:var(--red)}
.spec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.08);margin-top:1rem}
.spec-cell{background:var(--pnl);padding:.9rem 1.1rem}
.spec-cell .l{font-family:var(--mono);font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em}
.spec-cell .v{font-family:var(--disp);font-size:1.1rem;margin-top:.2rem}

@media(max-width:900px){
  #sidebar{position:fixed;left:-280px;top:57px;z-index:250;transition:left .2s;box-shadow:4px 0 20px rgba(0,0,0,.6)}
  #sidebar.open{left:0}
  #sbToggle{display:inline-flex;font-family:var(--disp);background:none;border:1px solid rgba(255,255,255,.3);color:var(--wht);padding:.4rem .8rem;cursor:pointer}
  #main{padding:2rem 1.2rem 5rem}
  #searchbox{width:140px}
  .spec-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex;align-items:center;gap:1rem">
    <button id="sbToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="logo" onclick="showHome()">TV<b>BROAD</b> <span style="font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.4);letter-spacing:.15em">TUTORIAL SYSTEM</span></div>
  </div>
  <div class="sr-wrap">
    <input id="searchbox" placeholder="Search e.g. lower third, J-cut..." oninput="doSearch(this.value)">
    <div id="searchresults" class="hide"></div>
  </div>
  <div style="display:flex;align-items:center;gap:1rem">
    <span id="topProgress">0 / 0 steps</span>
    <button id="resetBtn" onclick="resetProgress()">Reset progress</button>
  </div>
</div>

<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="home"></div>
    <div id="stepView" class="hide"></div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const sections = [
{id:1,name:'Project setup',steps:[
  {title:'Build the folder structure',what:'Create the physical folder system that will hold every asset for TVBROAD before you open any editing software.',why:'A consistent folder structure means you never lose footage, never overwrite a graphic, and can hand the project to another editor without explaining anything.',how:['Create a root folder named TVBROAD.','Inside it, create: FOOTAGE, AUDIO, GRAPHICS, AFTER_EFFECTS, PREMIERE, EXPORTS, ARCHIVE.','Never save render output directly into FOOTAGE — renders go in GRAPHICS or EXPORTS.','Keep ARCHIVE for anything replaced, not deleted.'],visual:{type:'text',content:'TVBROAD/\n│\n├── FOOTAGE/\n├── AUDIO/\n├── GRAPHICS/\n├── AFTER_EFFECTS/\n├── PREMIERE/\n├── EXPORTS/\n└── ARCHIVE/'},cp:'I created the folder structure'},
  {title:'Create the Premiere Pro and After Effects projects',what:'Set up the two project files that will drive the whole edit.',why:'Premiere handles cutting and assembly; After Effects handles motion graphics. Keeping them as separate linked projects lets you re-render a graphic without touching your edit.',how:['Open Premiere Pro → New Project → save into TVBROAD/PREMIERE/ as TVBROAD_MASTER.prproj.','Open After Effects → New Project → save into TVBROAD/AFTER_EFFECTS/ as TVBROAD_GFX.aep.','Do not nest one project folder inside the other.'],visual:null,cp:'I created both project files'},
  {title:'Establish resolution and frame rate',what:'Lock the technical specification for the whole production before importing anything.',why:'Mixing frame rates or resolutions mid-project causes drift, judder, and re-renders you cannot fix later — lock it now.',how:['Resolution: 1920×1080.','Frame rate: 30 FPS (or 29.97 if matching broadcast legacy delivery).','Audio: 48 kHz, 24-bit.','Set this as your Premiere sequence preset AND your After Effects composition setting so nothing has to be reinterpreted later.'],visual:{type:'text',content:'RESOLUTION   1920×1080\nFRAME RATE   30 FPS\nAUDIO        48kHz / 24-bit'},cp:'I locked resolution, frame rate, and audio settings'},
  {title:'Set a naming convention',what:'Define how every file will be named for the rest of the project.',why:'A clear naming convention is what makes search, version control, and handoff actually work later in this tutorial.',how:['Footage: CAM_001, CAM_002...','Graphics: LOWER_THIRD_01, TITLE_PACKAGE, END_CARD.','Versions: V01, V02... up to FINAL (never FINAL_FINAL_FINAL).','Exports: TVBROAD_MASTER, TVBROAD_YOUTUBE, TVBROAD_SOCIAL.'],visual:null,cp:'I defined my naming convention'}
]},
{id:2,name:'Premiere Pro',steps:[
  {title:'Import and organize footage',what:'Bring your recorded footage into Premiere and sort it into bins.',why:'Unsorted footage is the single biggest cause of slow edits — you will scrub through the same 40 clips a hundred times.',how:['File → Import → select everything inside TVBROAD/FOOTAGE/.','Create bins: Main Footage, B-Roll, Interviews, Screen Recordings.','Drag each imported clip into its matching bin.','Rename unclear clips immediately — do not wait.'],visual:null,cp:'I imported and organized my footage into bins'},
  {title:'Create your sequence and select takes',what:'Build the timeline you will actually edit on, then mark which takes are usable.',why:'Reviewing and marking good takes before cutting means you are never editing a mistake by accident.',how:['Right-click your main footage → New Sequence From Clip (or create manually at 1920×1080, 30 FPS).','Name it TVBROAD_MASTER.','Watch every take. Tag good ones green, bad ones red using clip markers.','Only usable takes get dragged to the timeline.'],visual:{type:'timing',rows:[['SEQUENCE','TVBROAD_MASTER'],['RESOLUTION','1920×1080'],['FRAME RATE','30 FPS'],['AUDIO','48 kHz']]},cp:'I created my sequence and reviewed my takes'},
  {title:'Learn the core editing techniques',what:'Understand the five techniques you will use constantly while assembling the rough cut.',why:'These are not decoration — each solves a specific pacing or continuity problem, and using the wrong one is the most common beginner mistake.',how:['CUT — a hard edit between two clips. Use for direct scene changes.','RIPPLE EDIT — trims a clip and shifts everything after it. Use when removing dead air.','ROLL EDIT — moves the cut point between two adjacent clips without changing total duration. Use for fine-tuning timing.','J-CUT — audio from the next clip starts before its video. Use to smooth a conversation transition.','L-CUT — audio from the current clip continues after its video ends. Use so a reaction shot doesn\'t feel abrupt.','Common mistake: using a hard CUT everywhere. It reads as choppy — reserve J/L-cuts for dialogue-heavy sections.'],visual:null,cp:'I understand cut, ripple, roll, J-cut, and L-cut'},
  {title:'Build the rough cut, then the fine cut',what:'Assemble your marked takes into a first full pass, then refine it.',why:'The rough cut establishes structure and length; the fine cut is where pacing and rhythm actually get built — trying to do both at once causes stalling.',how:['Rough cut: drag every green-tagged take onto V1 in story order. Do not trim precisely yet.','Watch the rough cut once, start to finish, without stopping.','Fine cut: trim every clip, remove dead air, tighten reaction shots.','Place supporting footage (B-roll) on V2, above the main track.'],visual:{type:'track',rows:[['V1 — Main video',10,60],['V2 — B-roll',65,25]]},cp:'I built a rough cut and refined it into a fine cut'},
  {title:'Add audio, transitions, and review',what:'Lock dialogue and music onto their tracks, apply transitions, then watch the full sequence.',why:'This is the last Premiere-only pass before graphics and audio finishing — catching structural issues now is far cheaper than after AE graphics are placed.',how:['Dialogue → A1. Music → A2. SFX → A3.','Add transitions only where a hard cut feels abrupt — do not apply one to every single cut.','Watch the entire sequence with sound at full volume.','Note anything to fix, but do not fix it yet — move to the next section first.'],visual:{type:'track',rows:[['A1 — Voice',5,70],['A2 — Music',0,90],['A3 — SFX',30,8]]},cp:'I placed audio, added transitions, and reviewed the sequence'}
]},
{id:3,name:'Footage editing',steps:[
  {title:'Structure the message for pacing',what:'Arrange your footage into a repeatable structural pattern rather than cutting arbitrarily.',why:'Viewers lose interest without rhythm. A predictable structure (open → message → break → next message) gives the edit a heartbeat.',how:['Follow this shape for each segment: Opening → Introduction → Main message → B-roll → Transition → Next message.','Never cut mid-sentence unless it is a deliberate J/L-cut.','Insert one piece of B-roll every 15–25 seconds of talking-head footage to reset visual attention.'],visual:{type:'text',content:'OPENING\n  ↓\nINTRODUCTION\n  ↓\nMAIN MESSAGE\n  ↓\nB-ROLL\n  ↓\nNEXT PERSON\n  ↓\nTRANSITION\n  ↓\nNEXT MESSAGE\n  ↓\nENDING'},cp:'I structured my segments using this pacing pattern'},
  {title:'Trim dead space with intent',what:'Remove pauses and mistakes without removing meaning.',why:'Every cut should exist for a reason — tightening pace, removing an error, or matching a beat — never just "because it felt long."',how:['Cut long pauses down to a natural breath length (usually 0.3–0.6s), not zero.','Remove false starts and stumbles, but keep one natural "um" occasionally — total silence removal reads as robotic.','When trimming to music, snap your cut points to the beat grid.'],visual:null,cp:'I trimmed dead space while preserving natural rhythm'}
]},
{id:4,name:'Audio',steps:[
  {title:'Clean and level dialogue',what:'Remove noise and bring every line of dialogue to a consistent, understandable volume.',why:'If dialogue is not consistently intelligible, nothing else in the edit matters — viewers will leave.',how:['Apply Noise Reduction / DeNoise to every dialogue clip with background hiss.','Use EQ to cut muddy low-end (below ~100Hz) and boost clarity around 3–5kHz.','Apply compression with a moderate ratio (3:1) to even out volume swings.','Target dialogue around -16 LUFS.'],visual:{type:'text',content:'VOICE     target -16 LUFS\nMUSIC     target -20 LUFS (under dialogue)\nSFX       target -18 LUFS'},cp:'I cleaned, EQ\'d, and leveled my dialogue'},
  {title:'Place music and SFX, then balance everything',what:'Add music and sound effects on their own tracks and duck them under dialogue.',why:'Dialogue must always remain understandable when music is playing — this is the single most common audio mistake in amateur video.',how:['Music on A2, SFX on A3, ambience on A4.','Automatically or manually duck music by -6 to -10dB whenever dialogue is present.','Add short SFX for transitions and graphic entrances — keep them subtle, not distracting.','Do a full final pass checking for clipping (anything hitting 0dB) and fix it.'],visual:null,cp:'I placed music/SFX and balanced the full mix'}
]},
{id:5,name:'After Effects',steps:[
  {title:'Set up your composition',what:'Create the After Effects composition that matches your Premiere sequence exactly.',why:'Any mismatch in resolution or frame rate between AE and Premiere causes graphics to look soft or judder when placed on the timeline.',how:['Composition → New Composition.','Resolution: 1920×1080. Frame rate: 30 FPS. Duration: match the graphic\'s length (e.g. 4s for a lower third).','Name compositions clearly: LOWER_THIRD_01, TITLE_PACKAGE, etc.'],visual:null,cp:'I created a matching AE composition'},
  {title:'Animate a lower third with exact timing',what:'Build the entrance, hold, and exit animation for a lower third graphic using precise keyframe values.',why:'Vague timing ("animate it in") produces inconsistent, unprofessional motion — exact values are what make broadcast graphics feel deliberate.',how:['Set Position start X = -500 (off-screen left), end X = 0, over 0.4 seconds, with Easy Ease on both keyframes.','Set Opacity 0 → 100 over the first 0.2 seconds only.','Hold from 0.5s to 3.5s with no keyframes.','Animate the exit as the reverse of the entrance, starting at 3.5s.'],visual:{type:'timing',rows:[['0.00s','Graphic begins off-screen'],['0.15s','Graphic enters'],['0.35s','Graphic reaches position'],['0.45s','Text appears'],['0.50–3.50s','Hold'],['3.50s','Exit animation begins'],['4.00s','Graphic disappears']]},cp:'I animated a lower third with exact keyframe timing'},
  {title:'Refine with the Graph Editor and motion blur',what:'Smooth your keyframe velocity and add motion blur for a broadcast-quality finish.',why:'Linear, unadjusted keyframes look mechanical. A slight ease-out with overshoot is what separates amateur motion graphics from broadcast work.',how:['Select your Position keyframes → open the Graph Editor.','Drag the outgoing tangent of the first keyframe to create a fast start with a soft landing (ease-out).','Enable Motion Blur on the layer and the composition switch.','Render at a version number (V01, V02...) — never overwrite a previous approved version.'],visual:null,cp:'I refined easing in the Graph Editor and enabled motion blur'}
]},
{id:6,name:'Motion graphics',steps:[
  {title:'Build the opening title',what:'Create the graphic that opens every episode.',why:'The open sets the tone for the entire broadcast — it should be the most polished, highest-energy graphic in the package.',how:['Background: a simple animated shape or gradient sweep, 1–2 seconds.','Main title: scale in from 90% to 100% with Easy Ease, 0.3s.','Secondary title (episode name): fades in 0.2s after the main title settles.','Sync the title\'s hard landing to a music hit or SFX accent if you have one.'],visual:null,cp:'I built the opening title sequence'},
  {title:'Build the lower third and section transition',what:'Create the two graphics that appear most often throughout the episode.',why:'These two graphics need to be fast and lightweight since they interrupt footage constantly — an overlong lower third animation gets tiring after the tenth appearance.',how:['Lower third: reuse the timing from the After Effects section (0.4s entrance, 3s hold, 0.4s exit).','Section transition: a shape wipe covering the full frame, 0.3–0.5s, with motion blur enabled so it doesn\'t look like a static cut.','Keep both under 4 seconds total duration.'],visual:null,cp:'I built the lower third and section transition graphics'},
  {title:'Build the end card',what:'Create the final screen that closes the video.',why:'The end card is the last thing a viewer sees — it should feel resolved, not rushed, and should hold long enough to read.',how:['Hold for at least 4–5 seconds — do not cut it short.','Reuse the title typography from your opening for visual consistency.','Fade to black over the final 0.5 seconds rather than a hard cut.'],visual:null,cp:'I built the end card'}
]},
{id:7,name:'Broadcast package',steps:[
  {title:'Check visual consistency across the package',what:'Compare every graphic in the package side by side.',why:'A broadcast package only reads as professional if every graphic shares the same type, spacing, animation speed, and shape language — inconsistency is immediately noticeable even to casual viewers.',how:['Confirm the same typeface and weight is used across all titles.','Confirm all entrance/exit animations use the same duration (0.4s) and easing style.','Confirm panel shapes (rounded, angled, sharp) match across all graphics.','Fix any outlier before moving on — do not leave it for "later."'],visual:null,cp:'I checked and fixed consistency across the full package'}
]},
{id:8,name:'Final assembly',steps:[
  {title:'Import and place rendered graphics',what:'Bring your finished After Effects renders into the Premiere sequence and replace any placeholders.',why:'This is where the two separate projects finally merge into one program — mistakes here are the last ones a viewer will actually see.',how:['File → Import your rendered graphics from GRAPHICS/ into Premiere.','Place each graphic on V3 (Graphics) or V4 (Overlays), aligned to the exact moment it should appear.','Delete any placeholder text or temporary graphic completely — do not leave it disabled in the timeline.'],visual:{type:'track',rows:[['V3 — Graphics',20,15],['V4 — Overlays',40,10]]},cp:'I imported and placed all final graphics'},
  {title:'Full review pass',what:'Watch the entire program start to finish without stopping.',why:'This is the only way to catch pacing issues, audio dips, and graphic misalignments that are invisible when scrubbing clip by clip.',how:['Watch with sound on, at full length, no skipping.','Note every issue with a timestamp instead of fixing it mid-watch.','Fix all noted issues, then watch it again in full before moving to export.'],visual:null,cp:'I completed a full uninterrupted review pass'}
]},
{id:9,name:'Export',steps:[
  {title:'Choose your export preset',what:'Select the correct delivery specification for where this video is going.',why:'The wrong export preset either wastes file size (over-delivering for social media) or loses quality (under-delivering for a broadcast master).',how:['Click a preset below to see its exact specification.','Match your File → Export Media settings in Premiere to what is shown.','Never guess a bitrate — use the value shown for your chosen preset.'],visual:{type:'preset'},cp:'I selected and applied the correct export preset'}
]},
{id:10,name:'Final check',steps:[
  {title:'Run the master completion checklist',what:'Verify every category of the finished program before calling it done.',why:'This final gate exists because small mistakes — a misspelled lower third, a clipping audio peak — are the ones that slip through when you are tired of looking at the same timeline.',how:['Go through every checkbox below honestly — do not check something you have not actually verified.','If anything fails, return to the relevant section and fix it before re-checking.'],visual:{type:'mastercheck'},cp:null}
]}
];

/* Flatten into a single step list for prev/next + progress */
let flat = [];
sections.forEach(sec=>{
  sec.steps.forEach((st,i)=>flat.push({secId:sec.id,secName:sec.name,idxInSec:i,total:sec.steps.length,step:st}));
});
const totalSteps = flat.filter(f=>f.step.cp).length; // master check has no single cp, counted separately

/* ===================== STATE / STORAGE ===================== */
const STORE_KEY='tvbroad_progress_v1';
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||{done:{},current:0,masterChecks:{}}}
  catch(e){return {done:{},current:0,masterChecks:{}}}
}
let state = loadState();
function saveState(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){} }
function stepKey(secId,idx){return secId+'_'+idx}

function overallProgress(){
  const doneCount = flat.filter(f=>f.step.cp && state.done[stepKey(f.secId,f.idxInSec)]).length;
  return {done:doneCount,total:totalSteps,pct: totalSteps? Math.round(doneCount/totalSteps*100):0};
}
function sectionProgress(sec){
  const stepsWithCp = sec.steps.filter(s=>s.cp);
  if(sec.id===10){
    const mc = state.masterChecks;
    const allKeys=['v0','v1','v2','v3','v4','a0','a1','a2','a3','g0','g1','g2','g3','e0','e1','e2','e3'];
    const done = allKeys.filter(k=>mc[k]).length;
    return Math.round(done/allKeys.length*100);
  }
  if(!stepsWithCp.length)return 0;
  const done = sec.steps.filter((s,i)=>s.cp && state.done[stepKey(sec.id,i)]).length;
  return Math.round(done/stepsWithCp.length*100);
}

/* ===================== RENDER: SIDEBAR ===================== */
function renderSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML = sections.map(sec=>{
    const pct=sectionProgress(sec);
    return `<div class="sb-item" data-sec="${sec.id}" onclick="openSection(${sec.id})">
      <div class="sb-num">${String(sec.id).padStart(2,'0')}</div>
      <div class="sb-name">${sec.name}</div>
      <div class="sb-bar"><div class="sb-fill" style="width:${pct}%"></div></div>
      <div class="sb-pct">${pct}% complete</div>
    </div>`;
  }).join('');
  const op=overallProgress();
  document.getElementById('topProgress').textContent = `${op.done} / ${op.total} steps · ${op.pct}%`;
}

/* ===================== VISUAL RENDERERS ===================== */
function renderVisual(v){
  if(!v) return '';
  if(v.type==='text') return `<div class="visual-box">${v.content}</div>`;
  if(v.type==='timing') return `<div class="visual-box">${v.rows.map(r=>`<div class="timing-row"><span class="timing-t">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;
  if(v.type==='track') return `<div class="track-diagram">${v.rows.map(r=>`<div class="track-line"><span class="track-lbl">${r[0]}</span><div style="flex:1;background:rgba(255,255,255,.05);height:16px;position:relative"><div class="track-fill" style="position:absolute;left:${r[1]}%;width:${r[2]}%"></div></div></div>`).join('')}</div>`;
  if(v.type==='preset') return renderPresetBox();
  if(v.type==='mastercheck') return renderMasterCheck();
  return '';
}
const presets={
  Master:{res:'1920×1080',codec:'H.264',audio:'AAC 48kHz',bitrate:'~20 Mbps',fmt:'.mp4'},
  Youtube:{res:'3840×2160',codec:'H.264',audio:'AAC 48kHz',bitrate:'~45 Mbps',fmt:'.mp4'},
  'Social media':{res:'1080×1080',codec:'H.264',audio:'AAC 44.1kHz',bitrate:'~12 Mbps',fmt:'.mp4'},
  Archive:{res:'1920×1080',codec:'ProRes 422',audio:'PCM 48kHz',bitrate:'Lossless',fmt:'.mov'},
};
let activePreset='Master';
function renderPresetBox(){
  return `<div class="preset-row">${Object.keys(presets).map(p=>`<button class="preset-btn ${p===activePreset?'active':''}" onclick="setPreset('${p}')">${p}</button>`).join('')}</div>
  <div class="spec-grid" id="presetSpec"></div>`;
}
function setPreset(p){
  activePreset=p;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active',b.textContent===p));
  fillPresetSpec();
}
function fillPresetSpec(){
  const s=presets[activePreset];
  const el=document.getElementById('presetSpec');
  if(!el)return;
  el.innerHTML=`<div class="spec-cell"><div class="l">Resolution</div><div class="v">${s.res}</div></div>
  <div class="spec-cell"><div class="l">Codec</div><div class="v">${s.codec}</div></div>
  <div class="spec-cell"><div class="l">Audio</div><div class="v">${s.audio}</div></div>
  <div class="spec-cell"><div class="l">Bitrate</div><div class="v">${s.bitrate}</div></div>`;
}
const masterGroups=[
  {name:'Video',prefix:'v',items:['No accidental black frames','No unwanted clips','No visible editing mistakes','Graphics are aligned','Transitions work']},
  {name:'Audio',prefix:'a',items:['Dialogue is understandable','Music is balanced','No clipping','No unwanted noise']},
  {name:'Graphics',prefix:'g',items:['Titles are spelled correctly','Lower thirds are correct','Animations are consistent','No missing assets']},
  {name:'Export',prefix:'e',items:['Correct resolution','Correct frame rate','Correct file format','Final video watched completely']},
];
function renderMasterCheck(){
  return masterGroups.map(g=>`<div class="mc-group">
    <h4>${g.name}</h4>
    ${g.items.map((it,i)=>{
      const key=g.prefix+i;
      const done=!!state.masterChecks[key];
      return `<div class="mc-item ${done?'done':''}" onclick="toggleMasterCheck('${key}')"><div class="mc-box">${done?'✓':''}</div><span>${it}</span></div>`;
    }).join('')}
  </div>`).join('') + `<div id="masterComplete">TVBROAD MASTER COMPLETE</div>`;
}
function toggleMasterCheck(key){
  state.masterChecks[key]=!state.masterChecks[key];
  saveState();
  renderStep(currentFlatIndex);
  renderSidebar();
  checkMasterComplete();
}
function checkMasterComplete(){
  const allKeys=[];
  masterGroups.forEach(g=>g.items.forEach((_,i)=>allKeys.push(g.prefix+i)));
  const all = allKeys.every(k=>state.masterChecks[k]);
  const el=document.getElementById('masterComplete');
  if(el) el.style.display = all?'block':'none';
}

/* ===================== STEP VIEW ===================== */
let currentFlatIndex = 0;
function renderStep(i){
  currentFlatIndex = Math.max(0, Math.min(i, flat.length-1));
  const f = flat[currentFlatIndex];
  const sec = sections.find(s=>s.id===f.secId);
  const st = f.step;
  const key = stepKey(f.secId, f.idxInSec);
  const done = !!state.done[key];
  document.getElementById('home').classList.add('hide');
  document.getElementById('stepView').classList.remove('hide');
  document.getElementById('stepView').innerHTML = `
    <div class="sec-head">
      <div class="sec-eyebrow">Section ${String(sec.id).padStart(2,'0')} / ${sec.name}</div>
      <div class="step-counter">Step ${f.idxInSec+1} / ${f.total}</div>
      <h1 class="sec-title">${st.title}</h1>
    </div>
    <div class="block"><h3>What you are doing</h3><p>${st.what}</p></div>
    <div class="block"><h3>Why you are doing it</h3><p>${st.why}</p></div>
    <div class="block"><h3>How to do it</h3><ul>${st.how.map(h=>`<li>${h}</li>`).join('')}</ul></div>
    ${st.visual?`<div class="block"><h3>What it should look like</h3>${renderVisual(st.visual)}</div>`:''}
    ${st.cp?`<div class="checkpoint">
      <div class="cp-row ${done?'done':''}" onclick="toggleStepDone('${key}')">
        <div class="cp-box">${done?'✓':''}</div>
        <div class="cp-label">${done?'COMPLETED':'☐ '+st.cp}</div>
      </div>
    </div>`:''}
    <div class="step-nav">
      <button class="nav-arrow" ${currentFlatIndex===0?'disabled':''} onclick="renderStep(currentFlatIndex-1)">&larr; Previous</button>
      <button class="nav-arrow" ${currentFlatIndex===flat.length-1?'disabled':''} onclick="renderStep(currentFlatIndex+1)">Next &rarr;</button>
    </div>
  `;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', +el.dataset.sec===f.secId));
  if(st.visual && st.visual.type==='preset'){ fillPresetSpec(); }
  if(st.visual && st.visual.type==='mastercheck'){ checkMasterComplete(); }
  state.current = currentFlatIndex;
  saveState();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleStepDone(key){
  state.done[key] = !state.done[key];
  saveState();
  renderStep(currentFlatIndex);
  renderSidebar();
  renderHome();
}
function openSection(secId){
  const idx = flat.findIndex(f=>f.secId===secId);
  renderStep(idx);
}

/* ===================== HOME ===================== */
function renderHome(){
  const op=overallProgress();
  const hasProgress = op.done>0;
  document.getElementById('home').innerHTML = `
    <p class="home-eyebrow">TV broadcast training system</p>
    <h1 class="home-title">TV<em>BROAD</em></h1>
    <p class="home-sub">A complete TV broadcast video editing tutorial</p>
    <div class="stack-badge">PREMIERE PRO<span class="stack-plus">+</span>AFTER EFFECTS</div>
    <div>
      <button class="home-btn" onclick="renderStep(${hasProgress?state.current:0})">${hasProgress?'Continue tutorial &rarr;':'Start tutorial &rarr;'}</button>
    </div>
    <div class="home-progress-wrap">
      <div class="home-bar"><div class="home-bar-fill" style="width:${op.pct}%"></div></div>
      <div class="home-pct">Progress &mdash; ${op.pct}%</div>
    </div>
  `;
}
function showHome(){
  document.getElementById('stepView').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===================== SEARCH ===================== */
function doSearch(q){
  const box=document.getElementById('searchresults');
  q=q.trim().toLowerCase();
  if(!q){box.classList.add('hide');box.innerHTML='';return}
  const hits=[];
  flat.forEach((f,i)=>{
    const st=f.step;
    const hay=(st.title+' '+st.what+' '+st.why+' '+st.how.join(' ')).toLowerCase();
    if(hay.includes(q)) hits.push({i,title:st.title,sec:f.secName});
  });
  if(!hits.length){box.innerHTML='<div class="sr-item">No matches</div>';box.classList.remove('hide');return}
  box.innerHTML = hits.slice(0,8).map(h=>`<div class="sr-item" onclick="jumpSearch(${h.i})">${h.sec} &mdash; ${h.title}</div>`).join('');
  box.classList.remove('hide');
}
function jumpSearch(i){
  document.getElementById('searchresults').classList.add('hide');
  document.getElementById('searchbox').value='';
  renderStep(i);
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.sr-wrap')) document.getElementById('searchresults').classList.add('hide');
});

/* ===================== RESET ===================== */
function resetProgress(){
  if(!confirm('Reset all tutorial progress? This cannot be undone.'))return;
  state = {done:{},current:0,masterChecks:{}};
  saveState();
  renderSidebar();
  renderHome();
  showHome();
}

/* ===================== INIT ===================== */
renderSidebar();
renderHome();
</script>
</body>
</html>
